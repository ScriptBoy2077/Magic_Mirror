<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .date_area {
            font-size: 6vw;
        }
        .temp_area {
            display: flex;
            justify-content: center;
            gap: 16vh;
        }
        .temp {
            font-size: 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #monitor {
            font-size: 12vw;
        }
        #forecast {
            font-size: 12vw;
        }
        .content_area {
            font-size: 3vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }
        .buttons_area {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .button {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
        }
        .button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class='container'>
        <div class='date_area'>
            <div id='datetime'>2026.01.01 00:00:00</div>
        </div>
        <div class='temp_area'>
            <div class='temp'>
                <div>室外</div>
                <div><span id='forecast'>66</span>℃</div>
            </div>
            <div class='temp'>
                <div>室内</div>
                <div><span id='monitor'>88</span>℃</div>
            </div>
        </div>
        <div class='content_area'>
            <div id='wather_local'>本地：无雨雪</div>
            <div id='wather_nearby'>附近：最近的降雨带在10000公里外，小雨</div>
            <div id='clothes'>着装：随便穿</div>
            <div id='update'>更新：1970.01.01 00:00:00</div>
        </div>
    </div>
        <div class="buttons_area">
            <button class="button" onclick="refreshData()">更新</button>
            <button class="button" onclick="toggleDisplay()">镜面</button>
        </div>
    <script>
        let isSimplified = false;
        function refreshData() {
            fetch('http://127.0.0.1:8000/weather')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络错误...');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('forecast').textContent = data.forecast;
                    document.getElementById('monitor').textContent = data.monitor;
                    document.getElementById('wather_local').textContent = '本地：' + data.weather;
                    document.getElementById('wather_nearby').textContent = '附近：最近的降雨带在' + data.nearest + '公里外，' + data.rain;
                    document.getElementById('clothes').textContent = '着装：' + data.advice;
                    document.getElementById('update').textContent = '更新：' + data.update;
                })
                .catch(error => {
                    console.error('错误: ', error);
                    document.getElementById('forecast').textContent = '66';
                    document.getElementById('monitor').textContent = '88';
                    document.getElementById('wather_local').textContent = '本地：无雨雪';
                    document.getElementById('wather_nearby').textContent = '附近：最近的降雨带在10000公里外，小雨';
                    document.getElementById('clothes').textContent = '着装：随便穿';
                    document.getElementById('update').textContent = '更新：1970.01.01 00:00:00';
                });
        }
        function toggleDisplay() {
            isSimplified = !isSimplified;
            const elements = document.querySelectorAll('.container');
            elements.forEach(element => {
                element.classList.toggle('hidden', isSimplified);
            });
        }
        refreshData();
    </script>
    <script>
        setInterval(() => {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('sv-SE', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            });
            let result = formatter.format(now);
            result = result.replace(/-/g, '.');
            document.getElementById('datetime').textContent = result;
        }, 1000);
    </script>
    <script>
        function scheduleClick(targetHour, targetMinute) {
            const now = new Date();
            const targetTime = new Date();
            targetTime.setHours(targetHour, targetMinute, 0, 0);
            if (now > targetTime) {
                targetTime.setDate(targetTime.getDate() + 1);
            }
            const timeDiff = targetTime.getTime() - now.getTime();
            const element = document.querySelector('.container');
            setTimeout(() => {
                refreshData();
                if (element.classList.contains('hidden')) {
                    toggleDisplay();
                }
                scheduleClick(targetHour, targetMinute);
            }, timeDiff);
        }
        scheduleClick(6, 50);
    </script>
</body>
</html>
